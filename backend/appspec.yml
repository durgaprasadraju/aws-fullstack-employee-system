# AWS CodeDeploy application specification for blue-green deployment
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/ems-backend

permissions:
  - object: /opt/ems-backend
    owner: node
    group: node
    mode: 755
    type:
      - directory
  - object: /opt/ems-backend
    pattern: "**"
    owner: node
    group: node
    mode: 644
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
